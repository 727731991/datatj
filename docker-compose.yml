version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: report-system-backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/sql_app.db:/app/sql_app.db
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    networks:
      - report-system-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: report-system-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - report-system-network

networks:
  report-system-network:
    driver: bridge
